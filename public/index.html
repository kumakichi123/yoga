<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ヨガAI</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JFS0WY1RXE"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-JFS0WY1RXE');
</script>
<style>
:root{
  --gap:12px;
  --lav:#eadbfd;
  --lav-border:#d8c7f5;
  --tileH: clamp(80px, 18vh, 160px); /* 各タイル高さを固定 */
  --spd: 12s;
}

html,body{height:100%;margin:0;background:var(--lav)}
.stage{
  height:100vh;width:100vw;box-sizing:border-box;
  padding:var(--gap);display:grid;gap:var(--gap);
  grid-template-rows:1fr 1fr;background:var(--lav);
}
.lane{
  position:relative;overflow:hidden;background:var(--lav);
  border:1px solid var(--lav-border);border-radius:14px;
}

/* 走行帯：横の余白ゼロ、タイル間ギャップゼロ */
.belt{
  position:absolute;inset:0 auto 0 0;width:200%;height:100%;
  display:flex;align-items:center;gap:0;padding:0;
  animation: linear infinite;animation-duration: var(--spd);
  will-change:transform;
}
@keyframes rtl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes ltr{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.rtl .belt{animation-name:rtl}
.ltr .belt{animation-name:ltr}

/* タイル：16:9で等サイズ。境界や影もゼロにして隙間を消す */
.tile{
  height:var(--tileH);
  aspect-ratio:16/9;
  display:grid;place-items:center;
  background:#fff;border:0;margin:0;box-shadow:none;
}
.tile img{
  width:100%;height:100%;object-fit:contain;display:block;
  margin:0;border:0;pointer-events:none;user-select:none;
}
</style>
</head>
<body>
  <div class="stage">

    <!-- 上段：右→左 -->
    <div class="lane rtl">
      <div class="belt" style="--spd: 13s;">
        <div class="tile"><img src="pose/down-dog.jpg" alt="ダウンドッグ"></div>
        <div class="tile"><img src="pose/triangle_right.png" alt="三角右"></div>
        <div class="tile"><img src="pose/cobra.png" alt="コブラ"></div>
        <div class="tile"><img src="pose/malasana.png" alt="マラーサナ"></div>
        <div class="tile"><img src="pose/Grasshopper.png" alt="バッタやさしい"></div>
        <div class="tile"><img src="pose/child.png" alt="チャイルド"></div>

        <!-- 複製（無限ループ用） -->
        <div class="tile"><img src="pose/down-dog.jpg" alt=""></div>
        <div class="tile"><img src="pose/triangle_right.png" alt=""></div>
        <div class="tile"><img src="pose/cobra.png" alt=""></div>
        <div class="tile"><img src="pose/malasana.png" alt=""></div>
        <div class="tile"><img src="pose/Grasshopper.png" alt=""></div>
        <div class="tile"><img src="pose/child.png" alt=""></div>
      </div>
    </div>

    <!-- 下段：左→右 -->
    <div class="lane ltr">
      <div class="belt" style="--spd: 13s;">
        <div class="tile"><img src="pose/Parivrtta_right.jpg" alt="ねじランジ右"></div>
        <div class="tile"><img src="pose/cat-pose.png" alt="キャット＆カウ"></div>
        <div class="tile"><img src="pose/Sukhasana.png" alt="安楽座"></div>
        <div class="tile"><img src="pose/inaho.png" alt="いなほ"></div>
        <div class="tile"><img src="pose/seated-twist-right.jpg" alt="座位ねじり右"></div>
        <div class="tile"><img src="pose/frog.png" alt="カエル"></div>

        <!-- 複製 -->
        <div class="tile"><img src="pose/Parivrtta_right.jpg" alt=""></div>
        <div class="tile"><img src="pose/cat-pose.png" alt=""></div>
        <div class="tile"><img src="pose/Sukhasana.png" alt=""></div>
        <div class="tile"><img src="pose/inaho.png" alt=""></div>
        <div class="tile"><img src="pose/seated-twist-right.jpg" alt=""></div>
        <div class="tile"><img src="pose/frog.png" alt=""></div>
      </div>
    </div>

  </div>
</body>
</html>
